name: Build & Ingest Latest MIT Code - OSS (microsoft/vscode) into Canonical Ghost CAS (cas-v1)

on:
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:
    inputs:
      vscode_tag:
        description: 'Optional microsoft/vscode tag (e.g. 1.147.0); blank = latest release'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  resolve-version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.ver.outputs.tag }}
    steps:
      - id: ver
        env:
          INPUT_TAG: ${{ inputs.vscode_tag }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          if [ -n "$INPUT_TAG" ]; then
            TAG="$INPUT_TAG"
          else
            TAG=$(curl -fsSL -H "User-Agent: b8g-ghost" -H "Authorization: Bearer $GITHUB_TOKEN" https://api.github.com/repos/microsoft/vscode/releases/latest | node -e "const d=JSON.parse(require('fs').readFileSync(0,'utf8')); console.log(d.tag_name)")
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo ">>> Target microsoft/vscode MIT release: $TAG"

  build-code-oss:
    needs: resolve-version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            logical: code-oss-app-linux-x64.tar.zst
            gulp_task: vscode-linux-x64-min
            out_dir: ../VSCode-linux-x64/resources/app
          - os: windows-latest
            logical: code-oss-app-win64.tar.zst
            gulp_task: vscode-win32-x64-min
            out_dir: ../VSCode-win32-x64/resources/app
    runs-on: ${{ matrix.os }}
    steps:
      - name: Shallow clone microsoft/vscode @ ${{ needs.resolve-version.outputs.tag }}
        shell: bash
        run: |
          git clone --depth 1 --branch "${{ needs.resolve-version.outputs.tag }}" https://github.com/microsoft/vscode.git vscode-src

      - name: Setup Node.js matching vscode .nvmrc
        uses: actions/setup-node@v4
        with:
          node-version-file: vscode-src/.nvmrc

      - name: Install Linux build deps
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libx11-dev libxkbfile-dev libsecret-1-dev libkrb5-dev zstd

      - name: Add Windows SDK signtool.exe to PATH
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          SIGNTOOL_DIR=$(ls -d "/c/Program Files (x86)/Windows Kits/10/bin/"*/x64 2>/dev/null | sort -V | tail -n 1)
          if [ -n "$SIGNTOOL_DIR" ] && [ -f "$SIGNTOOL_DIR/signtool.exe" ]; then
            echo "$SIGNTOOL_DIR" >> "$GITHUB_PATH"
            echo "Added signtool.exe dir to PATH: $SIGNTOOL_DIR"
          else
            echo "WARNING: signtool.exe not found in Windows Kits"
          fi

      - name: Patch product.json -> Awesome-OS Code - OSS (Open VSX, zero telemetry)
        shell: bash
        run: |
          node -e "
            const fs = require('fs');
            const p = 'vscode-src/product.json';
            const prod = JSON.parse(fs.readFileSync(p, 'utf8'));
            prod.nameShort = 'Awesome-OS Code - OSS';
            prod.nameLong = 'Awesome-OS Code - OSS';
            prod.applicationName = 'code-oss';
            prod.dataFolderName = '.awesome-code-oss';
            prod.extensionsGallery = {
              serviceUrl: 'https://open-vsx.org/vscode/gallery',
              itemUrl: 'https://open-vsx.org/vscode/item',
              resourceUrlTemplate: 'https://open-vsx.org/vscode/unpkg/{publisher}/{name}/{version}/{path}',
              controlUrl: '',
              recommendationsUrl: ''
            };
            delete prod.aiConfig;
            fs.writeFileSync(p, JSON.stringify(prod, null, 2) + '\n');
            console.log('Patched product.json -> Awesome-OS Code - OSS');
          "

      - name: Install dependencies & build Code - OSS resources/app
        shell: bash
        working-directory: vscode-src
        env:
          NODE_OPTIONS: '--max-old-space-size=8192'
          VSCODE_SKIP_NODE_VERSION_CHECK: '1'
          GITHUB_TOKEN: ${{ github.token }}
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: |
          if [ -f pnpm-lock.yaml ]; then
            corepack enable || npm install -g pnpm
            pnpm install --frozen-lockfile
            pnpm run gulp ${{ matrix.gulp_task }}
          elif [ -f package-lock.json ]; then
            npm ci
            npm run gulp ${{ matrix.gulp_task }}
          else
            npm install
            npm run gulp ${{ matrix.gulp_task }}
          fi

      - name: Pack app-only resources/app (zero Electron) & upload to cas-v1
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.resolve-version.outputs.tag }}
        run: |
          set -euo pipefail
          APP_DIR="vscode-src/${{ matrix.out_dir }}"
          if [ ! -f "$APP_DIR/package.json" ]; then
            echo "ERROR: $APP_DIR/package.json not found"
            exit 1
          fi
          mkdir -p out-cas
          tar -C "$APP_DIR" -cf - . | zstd -q -9 -T0 -o "out-cas/${{ matrix.logical }}"
          BYTES=$(stat -c%s "out-cas/${{ matrix.logical }}" 2>/dev/null || wc -c < "out-cas/${{ matrix.logical }}")
          SHA=$(sha256sum "out-cas/${{ matrix.logical }}" | awk '{print $1}')
          cp "out-cas/${{ matrix.logical }}" "out-cas/${SHA}"
          gh release upload cas-v1 "out-cas/${SHA}" --repo awesome-os/b8g-ghost --clobber
          node -e "
            const fs = require('fs');
            fs.writeFileSync('out-cas/${{ matrix.logical }}.meta.json', JSON.stringify({
              filename: '${{ matrix.logical }}',
              sha256: '${SHA}',
              bytes: Number('${BYTES}'),
              version: '${TAG}',
              category: 'code-oss-upstream',
              download_url: 'https://github.com/awesome-os/b8g-ghost/releases/download/cas-v1/${SHA}'
            }, null, 2));
          "

      - uses: actions/upload-artifact@v4
        with:
          name: meta-${{ matrix.logical }}
          path: out-cas/*.meta.json

  update-index:
    needs: [resolve-version, build-code-oss]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: meta-*
          path: /tmp/code-oss-meta
          merge-multiple: true

      - name: Merge Code - OSS ${{ needs.resolve-version.outputs.tag }} into manifests/index.json (Keep-Last-5)
        run: |
          node -e "
            const fs = require('fs');
            const path = require('path');
            const idx = JSON.parse(fs.readFileSync('manifests/index.json', 'utf8'));
            for (const f of fs.readdirSync('/tmp/code-oss-meta').filter(x => x.endsWith('.meta.json')).sort()) {
              const m = JSON.parse(fs.readFileSync(path.join('/tmp/code-oss-meta', f), 'utf8'));
              const prev = idx.entries[m.filename];
              const history = Array.isArray(prev?.history) ? [...prev.history] : [];
              if (prev && prev.sha256 && prev.sha256 !== m.sha256) {
                history.unshift({
                  sha256: prev.sha256,
                  bytes: prev.bytes,
                  version: prev.version || 'prev',
                  retired_at: new Date().toISOString()
                });
              }
              idx.entries[m.filename] = {
                filename: m.filename,
                sha256: m.sha256,
                bytes: m.bytes,
                version: m.version,
                category: m.category,
                download_url: m.download_url,
                ...(history.length > 0 ? { history: history.slice(0, 5) } : {})
              };
            }
            const sorted = {};
            for (const k of Object.keys(idx.entries).sort()) sorted[k] = idx.entries[k];
            idx.entries = sorted;
            idx.total_entries = Object.keys(sorted).length;
            idx.updated_at = new Date().toISOString();
            fs.writeFileSync('manifests/index.json', JSON.stringify(idx, null, 2) + '\n');
            console.log('[code-oss-cas] Updated manifests/index.json -> total_entries=' + idx.total_entries);
          "
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manifests/index.json
          if ! git diff --cached --quiet; then
            git commit -m "feat(cas-v1): publish Awesome-OS Code - OSS ${{ needs.resolve-version.outputs.tag }} (built from microsoft/vscode MIT)"
            git pull --rebase origin main
            git push origin main
          fi
