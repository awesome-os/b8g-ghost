name: Release — b8g-ghost (4-OS Ghost Libraries + Semantic Hasher)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v0.1.0)'
        required: true
        default: 'v0.1.0'

permissions:
  contents: write

jobs:
  release-b8g-ghost:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.14.0
      - name: Run Ghost FFI & Semantic Registry Tests
        run: node --test ghost-ffi.test.mts semantic-registry.test.mts
      - name: Cross-Compile 4-OS Ghost Libraries & Package SDK
        run: |
          mkdir -p dist
          zig cc -target x86_64-windows-gnu -O2 -shared -s -Iinclude src/b8g_ghost.c src/ghost_sectium_display.c -o dist/ghost_sectium_display.dll -Wl,--out-implib,dist/libghost_sectium_display.dll.a
          zig cc -target x86_64-linux-gnu -O2 -shared -fPIC -s -Iinclude src/b8g_ghost.c src/ghost_sectium_display.c -o dist/ghost_sectium_display-linux-x64.so -ldl
          zig cc -target aarch64-linux-gnu -O2 -shared -fPIC -s -Iinclude src/b8g_ghost.c src/ghost_sectium_display.c -o dist/ghost_sectium_display-linux-arm64.so -ldl
          zig cc -target aarch64-macos -O2 -shared -fPIC -Iinclude src/b8g_ghost.c src/ghost_sectium_display.c -o dist/ghost_sectium_display-macos-arm64.dylib
          tar -czf dist/b8g-ghost-sdk.tar.gz include src ghost-ffi.mts ghost-gen.mts semantic-registry.mts README.md LICENSE
          (cd dist && sha256sum * > SHA256SUMS.txt)
          ls -lh dist/
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || 'v0.1.0' }}
        run: |
          gh release delete "$TAG" --yes 2>/dev/null || true
          gh release create "$TAG" dist/* \
            --title "b8g-ghost ${TAG} — 4-OS Ghost Libraries (Win64 / Linux x64+ARM64 / Darwin ARM64) & Semantic AST Hasher" \
            --notes "Freshly cross-compiled 4-OS \`b8g-ghost\` Ghost Libraries (\`~10-52 KB\`), \`ghostFFI\`, and Dual-Layer Semantic Canonical AST Hasher (\`abi_hash\` + \`impl_hash\`)."
