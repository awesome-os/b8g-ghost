name: Ingest Debloated Rolling-Latest Upstream OBS Studio into Canonical Ghost CAS (cas-v1)

on:
  schedule:
    - cron: '0 10 * * *'
  workflow_dispatch:
    inputs:
      obs_version:
        description: 'Optional explicit OBS Studio release tag override e.g. 33.0.3 (blank = latest)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  ingest-obs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install zstd and unzip
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq zstd unzip

      - name: Download, Debloat & Upload Rolling-Latest OBS Studio -> cas-v1
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_VERSION: ${{ inputs.obs_version }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/obs-in /tmp/obs-out

          node -e '
            const fs = require("fs");
            const inputVer = (process.env.INPUT_VERSION || "").trim();
            const apiUrl = inputVer
              ? `https://api.github.com/repos/obsproject/obs-studio/releases/tags/${encodeURIComponent(inputVer)}`
              : "https://api.github.com/repos/obsproject/obs-studio/releases/latest";

            const headers = {
              "User-Agent": "b8g-ghost",
              "Accept": "application/vnd.github+json"
            };
            if (process.env.GH_TOKEN) {
              headers["Authorization"] = `Bearer ${process.env.GH_TOKEN}`;
            }

            (async () => {
              const res = await fetch(apiUrl, { headers });
              if (!res.ok) throw new Error(`HTTP ${res.status} for ${apiUrl}`);
              const rel = await res.json();
              const tag = (rel.tag_name || "").trim();
              if (!tag) throw new Error("Missing tag_name in OBS Studio release response");

              const asset = (rel.assets || []).find((a) => {
                const n = a.name || "";
                return /Windows-x64\.zip$/i.test(n) &&
                  !/Full-Installer/i.test(n) &&
                  !/Installer/i.test(n) &&
                  !/PDB/i.test(n) &&
                  !/\.exe$/i.test(n) &&
                  !/\.pdb$/i.test(n);
              });

              if (!asset || !asset.browser_download_url) {
                throw new Error(`No portable Windows-x64.zip asset found in OBS Studio release ${tag}`);
              }

              const picked = {
                version: tag,
                name: asset.name,
                url: asset.browser_download_url
              };
              fs.writeFileSync("/tmp/obs-in/resolved.json", JSON.stringify(picked, null, 2));
              console.log(">>> Resolved OBS Studio release:", picked.version);
              console.log("    win64:", picked.name, "->", picked.url);
            })().catch((err) => { console.error(err); process.exit(1); });
          '

          VER=$(node -e "console.log(JSON.parse(require('fs').readFileSync('/tmp/obs-in/resolved.json','utf8')).version)")
          WIN_URL=$(node -e "console.log(JSON.parse(require('fs').readFileSync('/tmp/obs-in/resolved.json','utf8')).url)")
          WIN_NAME=$(node -e "console.log(JSON.parse(require('fs').readFileSync('/tmp/obs-in/resolved.json','utf8')).name)")

          echo ">>> Fetching $WIN_URL"
          curl -fsSL "$WIN_URL" -o "/tmp/obs-in/${WIN_NAME}"
          RAW_BYTES=$(stat -c%s "/tmp/obs-in/${WIN_NAME}")

          WORK="/tmp/obs-in/work-win64"
          rm -rf "$WORK" && mkdir -p "$WORK"
          unzip -q "/tmp/obs-in/${WIN_NAME}" -d "$WORK"

          # Locate OBS root directory (containing bin/64bit/obs64.exe and data/)
          OBS_EXE=$(find "$WORK" -maxdepth 4 -type f -iname "obs64.exe" | head -n 1 || true)
          if [ -z "$OBS_EXE" ]; then
            echo "ERROR: Could not locate obs64.exe inside extracted $WIN_NAME"
            exit 1
          fi
          OBS_ROOT=$(dirname "$(dirname "$(dirname "$OBS_EXE")")")
          if [ ! -d "$OBS_ROOT/bin" ] || [ ! -d "$OBS_ROOT/data" ]; then
            echo "ERROR: Unexpected OBS directory layout around $OBS_EXE (computed root: $OBS_ROOT)"
            exit 1
          fi

          # Enable clean portable mode at root
          : > "$OBS_ROOT/portable_mode.txt"

          # Debloat: strip unused non-English locale files (data/**/locale/*.ini keeping en-US.ini, *.qm keeping en*)
          find "$OBS_ROOT/data" -type f -path '*/locale/*.ini' ! -name 'en-US.ini' -delete || true
          find "$OBS_ROOT" -type f -iname '*.qm' ! -iname 'en*' ! -iname '*_en*' -delete || true

          # Strip *.pdb debug symbols if present
          find "$OBS_ROOT" -type f -iname '*.pdb' -delete || true

          LOGICAL="obs-win64.tar.zst"
          OUT_ARCHIVE="/tmp/obs-out/${LOGICAL}"
          tar -C "$OBS_ROOT" -cf - . | zstd -q -9 -T0 -o "$OUT_ARCHIVE"
          DEBLOATED_BYTES=$(stat -c%s "$OUT_ARCHIVE")
          SHA=$(sha256sum "$OUT_ARCHIVE" | awk '{print $1}')
          cp "$OUT_ARCHIVE" "/tmp/obs-out/${SHA}"
          rm -rf "$WORK" "/tmp/obs-in/${WIN_NAME}"

          SAVED=$((RAW_BYTES - DEBLOATED_BYTES))
          echo "    $LOGICAL: $RAW_BYTES B (upstream) -> $DEBLOATED_BYTES B (debloated zst) | saved=$SAVED B | sha256=${SHA:0:12}..."

          node -e "
            const fs = require('fs');
            fs.writeFileSync('/tmp/obs-out/${LOGICAL}.meta.json', JSON.stringify({
              filename: '${LOGICAL}',
              sha256: '${SHA}',
              bytes: ${DEBLOATED_BYTES},
              raw_bytes: ${RAW_BYTES},
              version: '${VER}',
              category: 'obs-upstream',
              download_url: 'https://github.com/awesome-os/b8g-ghost/releases/download/cas-v1/${SHA}'
            }, null, 2));
          "

          BLOBS=$(find /tmp/obs-out -maxdepth 1 -type f -regextype posix-extended -regex '.*/[a-f0-9]{64}')
          gh release upload cas-v1 $BLOBS --repo awesome-os/b8g-ghost --clobber

      - name: Commit Updated manifests/index.json to Git
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          merge_manifest() {
            node -e "
              const fs = require('fs');
              const path = require('path');
              const idx = JSON.parse(fs.readFileSync('manifests/index.json', 'utf8'));
              for (const f of fs.readdirSync('/tmp/obs-out').filter(x => x.endsWith('.meta.json')).sort()) {
                const m = JSON.parse(fs.readFileSync(path.join('/tmp/obs-out', f), 'utf8'));
                const prev = idx.entries[m.filename];
                const history = Array.isArray(prev?.history) ? [...prev.history] : [];
                if (prev && prev.sha256 && prev.sha256 !== m.sha256) {
                  history.unshift({
                    sha256: prev.sha256,
                    bytes: prev.bytes,
                    version: prev.version || 'prev',
                    retired_at: new Date().toISOString()
                  });
                }
                idx.entries[m.filename] = {
                  filename: m.filename,
                  sha256: m.sha256,
                  bytes: m.bytes,
                  raw_bytes: m.raw_bytes,
                  version: m.version,
                  category: m.category,
                  download_url: m.download_url,
                  ...(history.length > 0 ? { history: history.slice(0, 5) } : {})
                };
              }
              const sorted = {};
              for (const k of Object.keys(idx.entries).sort()) sorted[k] = idx.entries[k];
              idx.entries = sorted;
              idx.total_entries = Object.keys(sorted).length;
              idx.updated_at = new Date().toISOString();
              fs.writeFileSync('manifests/index.json', JSON.stringify(idx, null, 2) + '\n');
              console.log('[obs-cas] Updated manifests/index.json -> total_entries=' + idx.total_entries);
            "
          }

          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            merge_manifest
            git add manifests/index.json
            if git diff --cached --quiet; then
              echo "[obs-cas] No manifest changes to commit."
              exit 0
            fi
            git commit -m "feat(cas-v1): roll debloated OBS Studio into canonical Ghost CAS"
            if git pull --rebase origin main && git push origin main; then
              exit 0
            fi
            git rebase --abort || true
            echo "[obs-cas] Push/rebase conflict on attempt $attempt, retrying..."
            sleep 3
          done
          echo "ERROR: Failed to push manifests/index.json after 5 attempts"
          exit 1
